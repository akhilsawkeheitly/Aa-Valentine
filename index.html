<!DOCTYPE html>
<html>
<head>
  <title>For My Valentine ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="secretHeart" style="position:fixed; bottom:20px; right:20px; font-size:30px; cursor:pointer;">

<p id="secretMessage" style="display:none; font-size:20px; color:#e63946; text-align:center; margin-top:20px;">

</p>

   <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">

  <h1>Happy Valentine’s Day  Sweety ❤️</h1>

<div class="heart" style="left:10%;">❤️</div>
<div class="heart" style="left:30%;">❤️</div>
<div class="heart" style="left:50%;">❤️</div>
<div class="heart" style="left:70%;">❤️</div>
<div class="heart" style="left:90%;">❤️</div>

  <div class="gallery" id="gallery">
  <img src="images/photo1.jpg.jpg" id="slideshow">
</div>

  <button onclick="showMessage()">Click Me 💌</button>

  <p id="loveMessage" style="display:none; font-size:20px; color:#e63946; text-align:center; margin-top:20px;"></p>


  <script src="script.js"></script>
<p id="popupLove" style="display:none; font-size:20px; color:#e63946;">
  Surprise! You are the best thing in my life 💖
</p>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
  // launch confetti when page loads
  window.onload = function() {
    confetti({
      particleCount: 100,
      spread: 70,
      origin: { y: 0.6 }
    });
  }
</script>

</html>
